services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: estoque_facil
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d estoque_facil"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
